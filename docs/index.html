
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Live Cyber Attack Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .live-link {
      position: fixed;
      bottom: 15px;
      right: 15px;
      z-index: 10;
      background: #166a50;
      color: white;
      padding: 12px 18px;
      border-radius: 6px;
      font: bold 13px Arial, sans-serif;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <iframe
    src="https://www.threat.live/map/"
    title="Interactive Live Cyber Threat Map"
    allowfullscreen>
  </iframe>

  <a class="live-link"
     href="https://www.threat.live/map/"
     target="_blank"
     rel="noopener noreferrer">
     OPEN ORIGINAL LIVE MAP ↗
  </a>

</body>
</html>
